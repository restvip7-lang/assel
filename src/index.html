<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7C86">
<title>/*TITLE*/</title>
<meta name="description" content="/*DESC*/">
<meta name="robots" content="/*ROBOTS*/">
<link rel="canonical" href="/*URL*/">
<meta property="og:type" content="website"><meta property="og:title" content="/*TITLE*/"><meta property="og:description" content="/*DESC*/"><meta property="og:url" content="/*URL*/"><meta property="og:image" content="/*OGIMG*/"><meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<script>try{if(!matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("m");setTimeout(()=>document.documentElement.classList.remove("m"),2500)}}catch(_){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Prata&display=swap">
<style>
/* Layout: conversion first. Photo-led hero with a 3-tap picker that ends in WhatsApp,
   then a filterable catalogue with WhatsApp on every card, trust blocks, FAQ, contact.
   Object page: swipe gallery, price + €/m², payment plan, sticky contact bar. */
:root{
  --bg:#F6F8F9; --surface:#FFFFFF; --ink:#0E1B2C; --muted:#5B6B7C; --line:#DDE4EA;
  --sea:#0A7C86; --sea-soft:#E3F2F3; --coral:#FF6A3D; --wa:#1FAF5A; --wa-ink:#FFFFFF; --tg:#2A9BD8;
  --display:"Prata", Georgia, serif; --body:"Onest", "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B141D;--surface:#121F2B;--ink:#EAF1F6;--muted:#9AABBA;--line:#22323F;--sea:#35B6C0;--sea-soft:#123038;--coral:#FF8055;--wa:#22B862;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B141D;--surface:#121F2B;--ink:#EAF1F6;--muted:#9AABBA;--line:#22323F;--sea:#35B6C0;--sea-soft:#123038;--coral:#FF8055;--wa:#22B862;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.w{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.6vw,42px);line-height:1.1}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}
.proto{background:var(--ink);color:var(--bg);font-size:12px;text-align:center;padding:5px 16px}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hd .w{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand .mk{width:38px;height:38px;flex:none}
.brand b{display:block;font-weight:800;font-size:17px;line-height:1.1;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav{display:flex;gap:22px;font-weight:500;font-size:15px}
.nav a{color:var(--ink);text-decoration:none}
.nav a:hover{color:var(--sea)}
.lang{white-space:nowrap;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ink);padding:7px 10px;font-weight:600;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.98)}
.btn svg{width:19px;height:19px;fill:currentColor;flex:none}
.wa{background:var(--wa);color:var(--wa-ink)}.tg{background:var(--tg);color:#fff}
.ghost{background:var(--sea-soft);color:var(--sea)}
.dark{background:var(--ink);color:var(--bg)}
.hico{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;flex:none;transition:transform .15s}
.hico:hover{transform:scale(1.08)}
.hico svg{width:20px;height:20px;fill:currentColor}
.hico.wa{background:var(--wa)}.hico.tg{background:var(--tg)}

/* hero */
.hero{position:relative;color:#fff;overflow:hidden}
.hero>img{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,20,32,.88) 0%,rgba(8,20,32,.6) 48%,rgba(8,20,32,.15) 100%)}
.hero .w{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;padding-block:56px 64px;align-items:center}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#3BE07F;box-shadow:0 0 0 4px rgba(59,224,127,.25)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,5.4vw,66px);line-height:1.04;margin-top:18px}
.hero h1 em{font-style:normal;color:#FFC9B5;white-space:nowrap}
.hero p.sub{font-size:clamp(16px,1.6vw,19px);max-width:46ch;opacity:.92;margin:18px 0 0}
.agent{display:flex;align-items:center;gap:14px;margin-top:26px}
.agent .ph{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:linear-gradient(160deg,#F4B98E,#C9705A);display:grid;place-items:center;font-family:var(--body);font-weight:700;color:#fff;font-size:22px;flex:none}
.agent b{display:block}.agent span{font-size:14px;opacity:.85}
.ticks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:14px}
.ticks span::before{content:"✓";color:#3BE07F;font-weight:800;margin-right:6px}

/* quick picker */
.pick{background:var(--surface);color:var(--ink);border-radius:24px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:grid;gap:16px;min-width:0}
.pick h3{font-size:20px;font-weight:700}
.pick .q{display:grid;gap:8px}
.pick .q>span{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft);color:var(--sea);font-weight:700}
.pick .preview{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);border-left:3px solid var(--wa)}
.pick .preview b{color:var(--ink);font-weight:600}
.pick .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .btn{width:100%;padding:15px}
.pick small{color:var(--muted);font-size:12px;text-align:center}

/* trust strip */
.strip{background:var(--surface);border-bottom:1px solid var(--line)}
.strip .w{display:grid;grid-template-columns:repeat(4,1fr)}
.strip div{padding:20px 16px 20px 0;min-width:0}
.strip div+div{padding-left:20px;border-left:1px solid var(--line)}
.strip b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.strip b.tbd{color:var(--muted)}
.strip span{font-size:14px;color:var(--muted)}

/* catalogue */
.sec{padding-block:64px 0}
.sechd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px}
.sechd p{margin:8px 0 0;color:var(--muted);max-width:56ch}
.filters{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding-block:14px;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.fl{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.fl label{font-size:12px;color:var(--muted);font-weight:600}
.fl select{border:0;background:none;color:var(--ink);font-weight:600;padding:4px 0}
.found{margin-left:auto;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 16px 40px rgba(14,27,44,.12);transform:translateY(-2px)}
.ph-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--sea-soft)}
.ph-wrap .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ph-wrap .track::-webkit-scrollbar{display:none}
.ph-wrap img{flex:0 0 100%;height:100%;object-fit:cover;scroll-snap-align:start}
.ph-wrap img.plan{object-fit:contain;background:#fff;padding:10px}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.badge{background:var(--surface);color:var(--ink);font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px}
.badge.hot{background:var(--coral);color:#fff}
.play{position:absolute;right:10px;bottom:10px;z-index:2;display:inline-flex;align-items:center;gap:7px;background:rgba(14,27,44,.8);color:#fff;font-size:12px;font-weight:700;padding:6px 10px 6px 6px;border-radius:999px;text-decoration:none}
.play i{width:20px;height:20px;border-radius:50%;background:var(--coral);position:relative}
.play i::after{content:"";position:absolute;left:8px;top:6px;border-left:6px solid #fff;border-block:4px solid transparent}
.vid{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:18px;overflow:hidden;margin-top:14px;background:var(--ink);cursor:pointer}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.75}
.vid .pl{position:absolute;inset:0;display:grid;place-items:center}
.vid .pl i{width:72px;height:72px;border-radius:50%;background:var(--coral);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.vid .pl i::after{content:"";position:absolute;left:29px;top:22px;border-left:20px solid #fff;border-block:14px solid transparent}
.vid .vc{position:absolute;left:14px;bottom:12px;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6)}
.dots i.on{background:#fff}
.no{position:absolute;bottom:10px;left:10px;background:rgba(14,27,44,.75);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px}
.cb{padding:16px 16px 18px;display:grid;gap:10px;flex:1}
.cb .pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cb .pr b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.cb .pr span{font-size:13px;color:var(--muted)}
.cb h3{font-size:17px;font-weight:600;line-height:1.3}
.cb h3 a{color:inherit;text-decoration:none}
.cb h3 a:hover{color:var(--sea)}
.specs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.specs span b{color:var(--ink);font-weight:600}
.cb .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.cb .acts .ghost{grid-column:1/-1}
.cb .acts .btn{padding:11px 12px}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center}

/* steps / about */
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:center}
.about .pic{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#F4B98E,#C9705A)}
.about .pic img{width:100%;height:100%;object-fit:cover;opacity:.35;mix-blend-mode:multiply}
.about .pic span{position:absolute;left:16px;bottom:16px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px}
.about p{font-size:17px;color:var(--muted);max-width:58ch}
.about .sig{font-family:var(--display);font-size:26px;color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.step b{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--sea-soft);color:var(--sea);font-weight:800}
.step h3{font-size:17px;margin-top:14px}
.step p{margin:6px 0 0;color:var(--muted);font-size:14px}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.rev{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px}
.rev .st{color:#F2A900;letter-spacing:2px}
.rev p{margin:10px 0;font-size:15px}
.rev small{color:var(--muted)}
.faq{margin-top:24px;display:grid;gap:10px;max-width:860px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 18px}
.faq summary{cursor:pointer;font-weight:600;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--sea);font-weight:800;font-size:20px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{margin:0 0 16px;color:var(--muted)}

/* contact */
.contact{margin-block:64px 40px;background:var(--ink);color:var(--bg);border-radius:28px;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:clamp(22px,4vw,48px)}
.contact h2{color:var(--bg)}
.contact p{opacity:.8;max-width:40ch}
.contact .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
form.lead{display:grid;gap:10px;align-content:start}
form.lead label{font-size:13px;font-weight:600;opacity:.8}
form.lead input,form.lead select{width:100%;padding:14px;border-radius:12px;border:0;background:var(--surface);color:var(--ink)}
form.lead .btn{margin-top:6px;background:var(--coral);color:#fff;padding:15px}
form.lead .ok{background:var(--surface);color:var(--ink);border-radius:12px;padding:14px;font-size:14px}
footer{padding-block:10px 110px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* object page */
.crumbs{font-size:14px;color:var(--muted);padding-block:18px 10px}
.crumbs a{color:var(--sea);text-decoration:none}
.gal{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:min(56vw,520px);border-radius:22px;overflow:hidden}
.gal button{border:0;padding:0;background:var(--sea-soft);overflow:hidden;position:relative}
.gal button:first-child{grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gal img.plan{object-fit:contain;background:#fff;padding:8px}
.gal button:nth-child(n+4){display:none}
.gal button:hover img{transform:scale(1.03)}
.gal .more{position:absolute;inset:0;background:rgba(14,27,44,.55);color:#fff;display:grid;place-items:center;font-weight:700}
.ob{display:grid;grid-template-columns:1fr 380px;gap:36px;margin-top:28px;align-items:start}
.ob h1{font-family:var(--body);font-weight:700;letter-spacing:-.02em;font-size:clamp(28px,3.4vw,42px);line-height:1.1}
.ob .loc{color:var(--muted);margin-top:8px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{font-size:19px}
.ob h2{font-size:26px;margin-top:36px}
.ob p{font-size:17px;max-width:64ch;color:var(--ink)}
.plan-pay{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.plan-pay div{padding:16px;min-width:0}
.plan-pay div+div{border-left:1px solid var(--line)}
.plan-pay b{display:block;font-size:22px;font-weight:800}
.plan-pay span{font-size:13px;color:var(--muted)}
.near{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.near span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px}
.map{margin-top:14px;aspect-ratio:16/8;max-width:100%;border-radius:18px;position:relative;overflow:hidden;background:
  radial-gradient(circle at 20% 130%,var(--sea) 0 42%,transparent 42.4%),
  repeating-linear-gradient(28deg,var(--line) 0 1.5px,transparent 1.5px 30px),
  repeating-linear-gradient(118deg,var(--line) 0 1.5px,transparent 1.5px 44px),var(--surface)}
.map .spot{position:absolute;left:55%;top:42%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:color-mix(in srgb,var(--coral) 22%,transparent);border:2px dashed var(--coral)}
.map small{position:absolute;left:12px;bottom:12px;background:var(--surface);padding:8px 12px;border-radius:10px;font-size:13px}
.side{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:14px;box-shadow:0 16px 40px rgba(14,27,44,.08)}
.soldnote{margin-top:14px;background:var(--coral);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600}
.side .pr{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.side .pm{color:var(--muted);font-size:14px}
.side .ag{display:flex;gap:12px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.side .ag .ph{width:48px;height:48px;border-radius:50%;background:linear-gradient(160deg,#F4B98E,#C9705A);display:grid;place-items:center;color:#fff;font-family:var(--body);font-weight:700;color:#fff;flex:none}
.side .ag small{display:block;color:var(--muted)}
.side .btn{width:100%;padding:15px}
.side .msg{font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px}
.share{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.share code{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--sea);font-family:var(--body);font-weight:600}
.share button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none}
.bar .w{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center}
.bar .pp b{display:block;font-weight:800;font-size:17px;line-height:1.1}
.bar .pp span{font-size:12px;color:var(--muted)}
.bar .btn{padding:12px}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;font-size:14px;max-width:min(460px,calc(100% - 32px));box-shadow:0 14px 40px rgba(0,0,0,.3)}
.toast b{display:block;font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}

@media (max-width:980px){
  .nav{display:none}
  .hero .w,.about,.contact,.ob{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr)}
  .steps,.reviews{grid-template-columns:1fr 1fr}
  .side{position:static}
  .bar{display:block}
}
@media (max-width:620px){
  .hd .btn span{display:none}.hd .btn{padding:10px}
  .brand small{display:none}.hd .w{gap:8px}
  .hero::before{background:linear-gradient(180deg,rgba(8,20,32,.55) 0%,rgba(8,20,32,.9) 70%)}
  .hero .w{padding-block:36px 28px;gap:24px}
  .strip .w{grid-template-columns:1fr 1fr}.strip div:nth-child(3){padding-left:0;border-left:0}
  .strip div{border-top:1px solid var(--line)}.strip div:nth-child(-n+2){border-top:0}
  .grid,.steps,.reviews{grid-template-columns:1fr}

   <div class="share"><code id="slink">${location.host}/o/${o.n}</code><button data-act="copy">Копировать</button></div>
  </aside></div>
  <section class="sec"><h2>Похожие объекты</h2><div class="grid">${sim.map(card).join("")}</div></section>
  ${contact(o)}<footer><span>Assel Usmanova · недвижимость в Алании</span><span>${location.host}/o/${o.n}</span></footer></div>`;
}

const app=document.getElementById("app"),bar=document.getElementById("bar");
const cur=()=>{const m=location.pathname.match(/^\/o\/(\d+)\/?$/);return m?O.find(o=>o.n==m[1]):null};
function render(){
 const o=cur();app.innerHTML=o?obj(o):home();
 bar.innerHTML=`<div class="w"><div class="pp">${o?`<b class="num">${eur(o.price)}</b><span>№${o.n} · ${o.rooms} · ${o.d}</span>`:`<b>Assel Usmanova</b><span>Отвечаю в WhatsApp</span>`}</div>
  <button class="btn wa" data-wa="${o?o.n:""}">${WA}${o?"Узнать про №"+o.n:"Написать в WhatsApp"}</button><button class="btn tg" data-tg="${o?o.n:""}" aria-label="Telegram">${TG}</button></div>`;
 document.querySelectorAll("select[data-f]").forEach(s=>s.value=st[s.dataset.f]);
 bindTracks();
}
function bindTracks(){document.querySelectorAll("[data-track]").forEach(t=>t.addEventListener("scroll",()=>{const i=Math.round(t.scrollLeft/t.clientWidth);t.parentNode.querySelectorAll(".dots i").forEach((d,k)=>d.classList.toggle("on",k===i))},{passive:true}))}
let tt;function toast(h){const el=document.getElementById("toast");el.innerHTML=h;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,4500)}
document.addEventListener("click",e=>{
 const w=e.target.closest("[data-wa]");if(w){const v=w.dataset.wa;const o=O.find(x=>x.n==v);const txt=v==="pick"?pickMsg():msg(o);if(SITE.whatsapp){location.href=`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(txt)}`}else toast(`<b>Номер WhatsApp ещё не указан</b>Будет отправлено: «${txt}»`);return}
 const tgb=e.target.closest("[data-tg]");if(tgb){const v=tgb.dataset.tg;const txt=v==="pick"?pickMsg():v?msg(O.find(x=>x.n==v)):"";if(txt){try{navigator.clipboard.writeText(txt).catch(()=>{})}catch(_){}toast(`<b>Текст скопирован</b>Вставьте его в чат с Assel: «${txt}»`)}if(SITE.telegram)setTimeout(()=>window.open(`https://t.me/${SITE.telegram}`,"_blank"),txt?900:0);else if(!txt)toast("<b>Telegram ещё не указан</b>");return}
 const pk=e.target.closest("[data-pk]");if(pk){st.pick[pk.dataset.pk]=pk.dataset.v;document.querySelectorAll(`[data-pk="${pk.dataset.pk}"]`).forEach(b=>b.setAttribute("aria-pressed",b===pk));document.getElementById("pv").innerHTML=`<b>Получить подборку, сообщение Assel:</b> ${pickMsg()}`;return}
 const g=e.target.closest("[data-go]");if(g){e.preventDefault();const go=()=>{const t=document.getElementById(g.dataset.go);if(!t)return;window.__lenis?window.__lenis.scrollTo(t,{offset:-80}):t.scrollIntoView({behavior:"smooth"})};if(cur()&&g.dataset.go!=="contact"){location.href="/#"+g.dataset.go}else go();return}
 const a=e.target.closest("[data-act]");if(!a)return;
 if(a.dataset.act==="lang")toast("<b>Языки</b>English и Türkçe скоро.");
 if(a.dataset.act==="video"){if(cur().youtube)location.href="https://www.youtube.com/watch?v="+cur().youtube;else toast("<b>Видео-обзор</b>Скоро здесь будет видео.");}
 if(a.dataset.act==="photo")toast("<b>Галерея</b>Полноэкранный просмотр фото скоро.");
 if(a.dataset.act==="copy"){const t=location.origin+"/o/"+cur().n+"/";try{navigator.clipboard.writeText(t).then(()=>a.textContent="Скопировано",()=>getSelection().selectAllChildren(document.getElementById("slink")))}catch(_){getSelection().selectAllChildren(document.getElementById("slink"))}}
});
document.addEventListener("change",e=>{const f=e.target.dataset.f;if(!f)return;st[f]=e.target.value;const l=filtered();const gr=document.getElementById("grid");gr.innerHTML=gridHTML(l);document.getElementById("found").textContent="Найдено: "+l.length;bindTracks();window.motion?.cards(gr)});
// Lead source: UTM tags from an Instagram link or the referring site, kept for this visit.
let SRC="";try{const q=new URLSearchParams(location.search);SRC=[q.get("utm_source"),q.get("utm_campaign"),q.get("utm_content")].filter(Boolean).join(" / ")||sessionStorage.getItem("src")||(document.referrer&&!document.referrer.includes(location.host)?new URL(document.referrer).host:"");sessionStorage.setItem("src",SRC)}catch(_){}
document.addEventListener("submit",async e=>{if(e.target.id!=="lead")return;e.preventDefault();const f=e.target,o=cur(),ok=document.getElementById("ok"),b=f.querySelector("button[type=submit]");
 const lead={name:document.getElementById("l-name").value,contact:document.getElementById("l-ph").value,when:document.getElementById("l-when").value,n:o?o.n:null,src:SRC,page:location.pathname,website:f.elements.website?.value||""};
 b.disabled=true;try{const r=await fetch("/api/lead/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lead)});if(!r.ok)throw 0;ok.textContent=`Спасибо, ${lead.name}! Assel получила заявку и напишет вам ${lead.when.toLowerCase()==="сегодня"?"сегодня":lead.when.toLowerCase()}.`;ok.hidden=false;f.querySelectorAll("input,select").forEach(x=>x.disabled=true);b.hidden=true}
 catch(_){b.disabled=false;const t=`Здравствуйте, Assel! Меня зовут ${lead.name}. Контакт: ${lead.contact}. Удобно связаться: ${lead.when.toLowerCase()}.${o?" Интересует объект №"+o.n+".":""}`;if(SITE.whatsapp)location.href=`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(t)}`;else{ok.textContent="Не получилось отправить. Напишите Assel в WhatsApp или Telegram.";ok.hidden=false}}});
if(location.hash){const t=document.getElementById(location.hash.slice(1));t&&setTimeout(()=>t.scrollIntoView(),0)}
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js" defer></script>
<script src="/motion.js" defer></script>
</body>
</html>
