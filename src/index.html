<!doctype html>
<html lang="/*LANG*/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7C86">
<title>/*TITLE*/</title>
<meta name="description" content="/*DESC*/">
<meta name="robots" content="/*ROBOTS*/">
<link rel="canonical" href="/*URL*/">/*HREFLANG*/
<meta property="og:type" content="website"><meta property="og:title" content="/*TITLE*/"><meta property="og:description" content="/*DESC*/"><meta property="og:url" content="/*URL*/"><meta property="og:image" content="/*OGIMG*/"><meta property="og:locale" content="/*OGLOCALE*/">
<meta name="twitter:card" content="summary_large_image">
<script>try{if(!matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("m");setTimeout(()=>document.documentElement.classList.remove("m"),2500)}}catch(_){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Prata&display=swap">
<style>
/* Layout: conversion first. Photo-led hero with a 3-tap picker that ends in WhatsApp,
   then a filterable catalogue with WhatsApp on every card, trust blocks, FAQ, contact.
   Object page: swipe gallery, price + €/m², payment plan, sticky contact bar. */
:root{
  --bg:#F6F8F9; --surface:#FFFFFF; --ink:#0E1B2C; --muted:#5B6B7C; --line:#DDE4EA;
  --sea:#0A7C86; --sea-soft:#E3F2F3; --coral:#FF6A3D; --wa:#1FAF5A; --wa-ink:#FFFFFF; --tg:#2A9BD8;
  --display:"Prata", Georgia, serif; --body:"Onest", "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B141D;--surface:#121F2B;--ink:#EAF1F6;--muted:#9AABBA;--line:#22323F;--sea:#35B6C0;--sea-soft:#123038;--coral:#FF8055;--wa:#22B862;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B141D;--surface:#121F2B;--ink:#EAF1F6;--muted:#9AABBA;--line:#22323F;--sea:#35B6C0;--sea-soft:#123038;--coral:#FF8055;--wa:#22B862;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.w{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.6vw,42px);line-height:1.1}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}
.proto{background:var(--ink);color:var(--bg);font-size:12px;text-align:center;padding:5px 16px}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hd .w{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand .mk{width:38px;height:38px;flex:none}
.brand b{display:block;font-weight:800;font-size:17px;line-height:1.1;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav{display:flex;gap:22px;font-weight:500;font-size:15px}
.nav a{color:var(--ink);text-decoration:none}
.nav a:hover{color:var(--sea)}
.lang{position:relative;font-weight:600;font-size:13px}
.lang summary{list-style:none;cursor:pointer;white-space:nowrap;border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--ink)}
.lang summary::-webkit-details-marker{display:none}.lang summary::after{content:" ▾"}
.lang div{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:grid;gap:2px;min-width:132px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(8,20,32,.16)}
.lang a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;white-space:nowrap}.lang a:hover{background:var(--sea-soft);color:var(--sea)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.98)}
.btn svg{width:19px;height:19px;fill:currentColor;flex:none}
.wa{background:var(--wa);color:var(--wa-ink)}.tg{background:var(--tg);color:#fff}
.ghost{background:var(--sea-soft);color:var(--sea)}
.dark{background:var(--ink);color:var(--bg)}
.hico{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;flex:none;transition:transform .15s}
.hico:hover{transform:scale(1.08)}
.hico svg{width:20px;height:20px;fill:currentColor}
.hico.wa{background:var(--wa)}.hico.tg{background:var(--tg)}

/* hero */
.hero{position:relative;color:#fff;overflow:hidden}
.hero img.bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,20,32,.74) 0%,rgba(8,20,32,.5) 46%,rgba(8,20,32,.06) 100%)}
.hero .w{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;padding-block:56px 64px;align-items:center}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;backdrop-filter:blur(6px)}
button.eyebrow{color:inherit;border:0;font-family:inherit;cursor:pointer;transition:background .2s}button.eyebrow:hover{background:rgba(255,255,255,.24)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#3BE07F;box-shadow:0 0 0 4px rgba(59,224,127,.25)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,5.4vw,66px);line-height:1.04;margin-top:18px}
.hero h1 em{font-style:normal;color:#FFC9B5;white-space:nowrap}
.hero p.sub{font-size:clamp(16px,1.6vw,19px);max-width:46ch;opacity:.92;margin:18px 0 0}
.agent{display:flex;align-items:center;gap:14px;margin-top:26px}
.agent .ph{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.35);overflow:hidden;background:linear-gradient(160deg,#F4B98E,#C9705A);display:grid;place-items:center;font-family:var(--body);font-weight:700;color:#fff;font-size:22px;flex:none}
.agent b{display:block}.agent span{font-size:14px;opacity:.85}
.ticks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:14px}
.ticks span::before{content:"✓";color:#3BE07F;font-weight:800;margin-right:6px}

/* quick picker */
.pick{background:var(--surface);color:var(--ink);border-radius:24px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:grid;gap:16px;min-width:0}
.pick h3{font-size:20px;font-weight:700}
.pick .q{display:grid;gap:8px}
.pick .q>span{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft);color:var(--sea);font-weight:700}
.pick .preview{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);border-left:3px solid var(--wa)}
.pick .preview b{color:var(--ink);font-weight:600}
.pick .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .btn{width:100%;padding:15px}
.pick small{color:var(--muted);font-size:12px;text-align:center}

/* trust strip */
.strip{background:var(--surface);border-bottom:1px solid var(--line)}
.strip .w{display:grid;grid-template-columns:repeat(4,1fr)}
.strip .w>div{padding:20px 16px 20px 0;min-width:0}
.strip .w>div+div{padding-left:20px;border-left:1px solid var(--line)}
.strip b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.strip b.tbd{color:var(--muted)}
.strip span{font-size:14px;color:var(--muted)}

/* catalogue */
.sec{padding-block:64px 0}
.sechd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px}
.sechd p{margin:8px 0 0;color:var(--muted);max-width:56ch}
.filters{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding-block:14px;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.fl{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.fl label{font-size:12px;color:var(--muted);font-weight:600}
.fl select{border:0;background:none;color:var(--ink);font-weight:600;padding:4px 0}
.found{margin-left:auto;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 16px 40px rgba(14,27,44,.12);transform:translateY(-2px)}
.ph-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--sea-soft)}
.ph-wrap .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ph-wrap .track::-webkit-scrollbar{display:none}
.ph-wrap img{flex:0 0 100%;height:100%;object-fit:cover;scroll-snap-align:start}
.ph-wrap img.plan{object-fit:contain;background:#fff;padding:10px}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.badge{background:var(--surface);color:var(--ink);font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px}
.badge.hot{background:var(--coral);color:#fff}
.play{position:absolute;right:10px;bottom:10px;z-index:2;display:inline-flex;align-items:center;gap:7px;background:rgba(14,27,44,.8);color:#fff;font-size:12px;font-weight:700;padding:6px 10px 6px 6px;border-radius:999px;text-decoration:none}
.play i{width:20px;height:20px;border-radius:50%;background:var(--coral);position:relative}
.play i::after{content:"";position:absolute;left:8px;top:6px;border-left:6px solid #fff;border-block:4px solid transparent}
.vid{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:18px;overflow:hidden;margin-top:14px;background:var(--ink);cursor:pointer}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.75}
.vid .pl{position:absolute;inset:0;display:grid;place-items:center}
.vid .pl i{width:72px;height:72px;border-radius:50%;background:var(--coral);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.vid .pl i::after{content:"";position:absolute;left:29px;top:22px;border-left:20px solid #fff;border-block:14px solid transparent}
.vid .vc{position:absolute;left:14px;bottom:12px;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.dots{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;justify-content:center;z-index:2}
.dots i{width:18px;height:22px;display:grid;place-items:center;cursor:pointer;font-style:normal}
.dots i::after{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s,background .2s}
.dots i.on::after{background:#fff;transform:scale(1.3)}
.arr{position:absolute;top:50%;z-index:2;width:38px;height:38px;margin-top:-19px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#0E1B2C;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s}
.arr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.arr.prev{left:10px}.arr.next{right:10px}.arr:hover{transform:scale(1.08)}
.ph-wrap:hover .arr,.arr:focus-visible{opacity:1}
@media (hover:none){.arr{display:none}}
/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(6,12,20,.94);display:grid;grid-template-rows:auto 1fr;opacity:0;transition:opacity .2s}
.lb.on{opacity:1}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#fff;font-weight:600}
.lb-x{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:24px;line-height:1}
.lb-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.lb-track::-webkit-scrollbar{display:none}
.lb-track figure{flex:0 0 100%;margin:0;display:grid;place-items:center;scroll-snap-align:center;padding:0 16px 24px;min-height:0}
.lb-track img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.lb-track img.plan{background:#fff}
.lb .arr{opacity:1;width:52px;height:52px;margin-top:0}.lb .arr.prev{left:20px}.lb .arr.next{right:20px}
.no{position:absolute;bottom:10px;left:10px;background:rgba(14,27,44,.75);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px}
.cb{padding:16px 16px 18px;display:grid;gap:10px;flex:1}
.cb .pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cb .pr b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.cb .pr span{font-size:13px;color:var(--muted)}
.cb h3{font-size:17px;font-weight:600;line-height:1.3}
.cb h3 a{color:inherit;text-decoration:none}
.cb h3 a:hover{color:var(--sea)}
.specs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.specs span b{color:var(--ink);font-weight:600}
.cb .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.cb .acts .ghost{grid-column:1/-1}
.cb .acts .btn{padding:11px 12px}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center}

/* steps / about */
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:center}
.about .pic{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#F4B98E,#C9705A)}
.about .pic img{width:100%;height:100%;object-fit:cover}
.ph{overflow:hidden}.ph img{display:block;width:100%;height:100%;object-fit:cover}
.work{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.work figure{margin:0;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.work img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.work figcaption{padding:12px 16px;font-size:14px;color:var(--muted)}
@media (max-width:620px){.work{grid-template-columns:1fr}}
.about p{font-size:17px;color:var(--muted);max-width:58ch}
.about .sig{font-family:var(--display);font-size:26px;color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.step b{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--sea-soft);color:var(--sea);font-weight:800}
.step h3{font-size:17px;margin-top:14px}
.step p{margin:6px 0 0;color:var(--muted);font-size:14px}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.rev{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px}
.rev .st{color:#F2A900;letter-spacing:2px}
.rev p{margin:10px 0;font-size:15px}
.rev small{color:var(--muted)}
.faq{margin-top:24px;display:grid;gap:10px;max-width:860px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 18px}
.faq summary{cursor:pointer;font-weight:600;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--sea);font-weight:800;font-size:20px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{margin:0 0 16px;color:var(--muted)}

/* contact */
.contact{margin-block:64px 40px;background:var(--ink);color:var(--bg);border-radius:28px;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:clamp(22px,4vw,48px)}
.contact h2{color:var(--bg)}
.contact p{opacity:.8;max-width:40ch}
.contact .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
form.lead{display:grid;gap:10px;align-content:start}
form.lead label{font-size:13px;font-weight:600;opacity:.8}
form.lead input,form.lead select{width:100%;padding:14px;border-radius:12px;border:0;background:var(--surface);color:var(--ink)}
form.lead .btn{margin-top:6px;background:var(--coral);color:#fff;padding:15px}
form.lead .ok{background:var(--surface);color:var(--ink);border-radius:12px;padding:14px;font-size:14px}
footer{padding-block:10px 110px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* object page */
.crumbs{font-size:14px;color:var(--muted);padding-block:18px 10px}
.crumbs a{color:var(--sea);text-decoration:none}
.gal{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:min(56vw,520px);border-radius:22px;overflow:hidden}
.gal button{border:0;padding:0;background:var(--sea-soft);overflow:hidden;position:relative}
.gal button:first-child{grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gal img.plan{object-fit:contain;background:#fff;padding:8px}
.gal button:nth-child(n+4){display:none}
.gal button:hover img{transform:scale(1.03)}
.gal .more{position:absolute;inset:0;background:rgba(14,27,44,.55);color:#fff;display:grid;place-items:center;font-weight:700}
.ob{display:grid;grid-template-columns:1fr 380px;gap:36px;margin-top:28px;align-items:start}
.ob h1{font-family:var(--body);font-weight:700;letter-spacing:-.02em;font-size:clamp(28px,3.4vw,42px);line-height:1.1}
.ob .loc{color:var(--muted);margin-top:8px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{font-size:19px}
.ob h2{font-size:26px;margin-top:36px}
.ob p{font-size:17px;max-width:64ch;color:var(--ink)}
.near{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.near span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px}
.map{margin-top:14px;aspect-ratio:16/8;max-width:100%;border-radius:18px;position:relative;overflow:hidden;background:
  radial-gradient(circle at 20% 130%,var(--sea) 0 42%,transparent 42.4%),
  repeating-linear-gradient(28deg,var(--line) 0 1.5px,transparent 1.5px 30px),
  repeating-linear-gradient(118deg,var(--line) 0 1.5px,transparent 1.5px 44px),var(--surface)}
.map .spot{position:absolute;left:55%;top:42%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:color-mix(in srgb,var(--coral) 22%,transparent);border:2px dashed var(--coral)}
.map small{position:absolute;left:12px;bottom:12px;background:var(--surface);padding:8px 12px;border-radius:10px;font-size:13px}
.side{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:14px;box-shadow:0 16px 40px rgba(14,27,44,.08)}
.soldnote{margin-top:14px;background:var(--coral);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600}
.side .pr{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.side .pm{color:var(--muted);font-size:14px}
.side .ag{display:flex;gap:12px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}

<script>const SITE=/*SITE*/{};const LANG="/*LANG*/",P="/*P*/",L=/*L*/{};const f=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]??m);const PATH=location.pathname.replace(/^\/(en|tr)(?=\/|$)/,"")||"/";const WHEN_RU=["Сегодня","Завтра","В выходные"];const IMG=new Proxy({},{get:(_,k)=>"/img/"+String(k)+".jpg"});</script>
<script>
const WA=`<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.2.5.2.5.4.1.1.1.7-.1 1.4Z"/></svg>`;

 let l=LIVE.filter(o=>(st.budget==="any"||o.price<=+st.budget)&&(st.rooms==="any"||o.rooms===st.rooms)&&(st.dist==="any"||o.d===st.dist)&&(st.seller==="any"||(st.seller==="owner")===!!o.owner));
 return l.sort((a,b)=>st.sort==="price"?a.price-b.price:st.sort==="m2"?a.price/a.area-b.price/b.area:a.sea-b.sea);

function home(){
 const l=filtered();
 return `<section class="hero"><picture><source media="(min-width:981px)" srcset="${IMG["hero-wide"]}"><img class="bg" src="${IMG.hero}" alt="${L.heroAlt}" fetchpriority="high"></picture><div class="w">

 <div class="strip"><div class="w">

 <section class="sec" id="guides"><h2>${L.guidesH}</h2><div class="gtiles">${G.map((g,i)=>`<a class="gtile" href="${P}/${g.slug}/"><span class="gi">0${i+1}</span><b>${g.h1}</b><span>${g.lead.split(". ")[0]}.</span><i>${L.read}</i></a>`).join("")}</div></section>
 <section class="sec" id="about"><div class="about"><div class="pic"><img src="${IMG.assel}" alt="${L.aboutAlt}" loading="lazy"></div>

   <div class="sig">Assel Usmanova</div>
   <p style="font-size:13px">${L.draftText}</p></div></div>
  <div class="work">${["showing","balcony","keys"].map((k,i)=>[k,L.work[i]]).map(([k,t])=>`<figure><img src="${IMG["w-"+k]}" alt="${t}" loading="lazy"><figcaption>${t}</figcaption></figure>`).join("")}</div>
  <div class="steps">${L.steps.map((s,i)=>`<div class="step"><b>${i+1}</b><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div></section>
 <section class="sec"><h2>${L.revH}</h2><div class="reviews">${[1,2,3].map(()=>`<div class="rev"><div class="st">★★★★★</div><p>${L.revP}</p><small>${L.revS}</small></div>`).join("")}</div></section>
 <section class="sec" id="faq"><h2>${L.faqH}</h2><div class="faq">
  ${L.faq.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")}
  <p style="font-size:13px;color:var(--muted)">${L.faqNote}</p></div></section>
 ${contact()}
 <footer><span>${L.footer}</span><span>${location.host}</span></footer></div>`;
}
function gridHTML(l){return l.map(card).join("")||`<div class="empty"><b>${L.emptyB}</b><p style="color:var(--muted)">${L.emptyP}</p><button class="btn wa" data-wa="">${WA}${L.writeMe}</button></div>`}
function contact(o){return `<section class="contact" id="contact"><div><h2>${o?f(L.cHo,{n:o.n}):L.cH}</h2>
  <p>${o?L.cPo:L.cP}</p>
  <div class="row"><button class="btn wa" data-wa="${o?o.n:""}">${WA}WhatsApp</button><button class="btn tg" data-tg>${TG}Telegram</button></div></div>
 <form class="lead" id="lead"><label for="l-name">${L.lName}</label><input id="l-name" required placeholder="${L.lNamePh}" autocomplete="name">
  <label for="l-ph">${L.lPh}</label><input id="l-ph" required placeholder="${L.lPhPh}">
  <label for="l-when">${L.lWhen}</label><select id="l-when">${L.when.map((w,i)=>`<option value="${i}">${w}</option>`).join("")}</select>
  <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
  <button class="btn" type="submit">${L.lSubmit}</button><div class="ok" id="ok" hidden role="status"></div></form></section>`}

function obj(o){
 const sim=LIVE.filter(x=>x!==o).sort((a,b)=>Math.abs(a.price-o.price)-Math.abs(b.price-o.price)).slice(0,3);
 return `<div class="w"><div class="crumbs"><a href="${P}/">${L.crumbAll}</a> / ${o.dn} / ${f(L.num,{n:o.n})}</div>
  <div class="gal">${o.imgs.map((k,i)=>`<button data-act="photo" data-i="${i}" aria-label="${f(L.openPhoto,{i:i+1})}"><img src="${IMG[k]}" alt="${f(L.photoAlt,{name:o.name,i:i+1})}" class="${k[0]==="p"?"plan":""}"${i?"":` style="view-transition-name:ph${o.n}"`}>${i===2&&o.imgs.length>3?`<span class="more">${f(L.morePhotos,{n:o.imgs.length-3})}</span>`:""}</button>`).join("")}</div>
  <div class="ob"><div>
   <div class="badges" style="position:static;margin-bottom:12px">${o.hot?`<span class="badge hot">${o.hot}</span>`:""}${o.tags.map(t=>`<span class="badge" style="background:var(--sea-soft);color:var(--sea)">${t}</span>`).join("")}</div>
   <h1>${o.auto?f(L.objH1Auto,{name:o.name,d:o.dn}):f(L.objH1,{rooms:o.rooms,area:o.area,name:o.name})}</h1><div class="loc">${[f(L.loc,{d:o.dn}),seaTxt(o),f(L.objNo,{n:o.n})].filter(Boolean).join(" · ")}</div>${o.sold?`<div class="soldnote">${L.soldNote}</div>`:""}
   <div class="kv"><div><span>${L.kRooms}</span><b>${o.rooms}</b></div><div><span>${L.kArea}</span><b class="num">${o.area} ${L.m2}</b></div>${o.floor?`<div><span>${L.kFloor}</span><b>${o.floor}</b></div>`:""}${o.year?`<div><span>${L.kYear}</span><b>${o.year}</b></div>`:""}</div>
   <h2>${L.aboutObj}</h2><p>${o.desc}</p>
   ${o.video?`<h2>${L.video}</h2><button class="vid" data-act="video" aria-label="${L.videoAria}"><img src="${IMG[o.imgs[1]]}" alt=""><span class="pl"><i></i></span><span class="vc">${L.videoCap}</span></button>`:""}
   ${o.near.length?`<h2>${L.nearH}</h2><div class="near">${o.near.map(n=>`<span>${n}</span>`).join("")}</div>`:""}
   <div class="map" role="img" aria-label="${L.mapAria}"><div class="spot"></div><small><b>${o.dn}</b> · ${L.mapNote}</small></div>
  </div>
  <aside class="side"><div><div class="pr num">${o.sold?L.sold:eur(o.price)}</div><div class="pm num">${f(L.perM2long,{p:eur(o.price/o.area)})} · ${o.owner?L.priceOwner:L.priceDev}</div></div>
   <button class="btn wa" data-wa="${o.n}">${WA}${f(L.writeAbout,{n:o.n})}</button>
   <div class="msg">${f(L.waNote,{msg:msg(o)})}</div>
   <button class="btn tg" data-tg="${o.n}">${TG}Telegram</button>
   <button class="btn ghost" data-go="contact">${L.book}</button>
   <div class="ag"><span class="ph"><img src="${IMG['assel-face']}" alt="Assel Usmanova" width="64" height="64"></span><div><b>Assel Usmanova</b><small>${L.agNote}</small></div></div>
   <div class="share"><code id="slink">${location.host}${P}/o/${o.n}</code><button data-act="copy">${L.copy}</button></div>
  </aside></div>
  <section class="sec"><h2>${L.similar}</h2><div class="grid">${sim.map(card).join("")}</div></section>
  ${contact(o)}<footer><span>${L.footer}</span><span>${location.host}/o/${o.n}</span></footer></div>`;
}

function guide(g){
 const blk=b=>b.type==="districts"?`<section class="sec"><h2>${b.h}</h2><div class="dgrid">${b.cards.map(c=>{const n=LIVE.filter(o=>o.d===c.d).length;return `<article class="dcard"><span class="dwho">${c.who}</span><h3>${c.name}</h3><p>${c.p}</p><div class="dact">${n?`<a class="btn ghost" href="${P}/?d=${encodeURIComponent(c.d)}#catalog">${f(L.dObjects,{n})}</a>`:""}<button class="btn wa" data-wa="d:${c.name}">${WA}${L.dPick}</button></div></article>`}).join("")}</div></section>`
  :b.type==="cards"?`<section class="sec"><h2>${b.h}</h2><div class="gcards">${b.cards.map((c,i)=>`<article class="gcard"><span class="gi">0${i+1}</span><h3>${c.t}</h3><p>${c.p}</p></article>`).join("")}</div></section>`
  :b.type==="steps"?`<section class="sec"><h2>${b.h}</h2><div class="steps">${b.items.map((t,i)=>`<div class="step"><b>${i+1}</b><p>${t}</p></div>`).join("")}</div></section>`
  :`<section class="sec"><h2>${b.h}</h2><ul class="glist">${b.items.map(t=>`<li>${t}</li>`).join("")}</ul>${b.note?`<p class="gnote">${b.note}</p>`:""}</section>`;
 return `<section class="ghero"><div class="w"><div class="crumbs"><a href="${P}/">${L.crumbHome}</a> / ${g.nav}</div><h1>${g.h1}</h1><p>${g.lead}</p>
  <div class="row"><button class="btn wa" data-wa="g:${g.slug}">${WA}${g.cta}</button><a class="btn ghost" href="${P}/#catalog">${L.seeListings}</a></div></div></section>
 <div class="w">${g.blocks.map(blk).join("")}
  <p class="gnote" style="margin-top:28px">${L.gDraft}</p>
  <section class="sec"><h2>${L.otherTopics}</h2><div class="gtiles">${G.filter(x=>x!==g).map(x=>`<a class="gtile" href="${P}/${x.slug}/"><b>${x.h1}</b><i>${L.read}</i></a>`).join("")}</div></section>
  ${contact()}<footer><span>${L.footer}</span><span>${location.host}/${g.slug}</span></footer></div>`;
}
const app=document.getElementById("app"),bar=document.getElementById("bar");
const curG=()=>{const m=PATH.match(/^\/([a-z-]+)\/?$/);return m?G.find(g=>g.slug===m[1]):null};
const cur=()=>{const m=PATH.match(/^\/o\/(\d+)\/?$/);return m?O.find(o=>o.n==m[1]):null};
function render(){
 const o=cur(),gd=curG();app.innerHTML=o?obj(o):gd?guide(gd):home();
 bar.innerHTML=`<div class="w"><div class="pp">${o?`<b class="num">${eur(o.price)}</b><span>${f(L.num,{n:o.n})} · ${o.rooms} · ${o.dn}</span>`:`<b>Assel Usmanova</b><span>${L.barSub}</span>`}</div>
  <button class="btn wa" data-wa="${o?o.n:""}">${WA}${o?f(L.cHo,{n:o.n}):L.waAria}</button><button class="btn tg" data-tg="${o?o.n:""}" aria-label="Telegram">${TG}</button></div>`;
 document.querySelectorAll("select[data-f]").forEach(s=>s.value=st[s.dataset.f]);
 enhanceSelects();
 bindTracks();
}
function enhanceSelects(){
 document.querySelectorAll("select:not([data-dd])").forEach(sel=>{
  sel.dataset.dd=1;sel.tabIndex=-1;sel.setAttribute("aria-hidden","true");
  const wrap=document.createElement("div");wrap.className="dd";sel.before(wrap);wrap.append(sel);
  const b=document.createElement("button");b.type="button";b.className="ddb";b.setAttribute("aria-haspopup","listbox");b.setAttribute("aria-expanded","false");
  const lab=sel.id&&document.querySelector(`label[for="${sel.id}"]`);if(lab){b.id=sel.id+"-b";lab.htmlFor=b.id;b.setAttribute("aria-label",lab.textContent)}
  const ul=document.createElement("ul");ul.className="ddl";ul.setAttribute("role","listbox");
  const sync=()=>{b.textContent=sel.options[sel.selectedIndex]?.text||"";ul.querySelectorAll("button").forEach((x,i)=>x.setAttribute("aria-selected",i===sel.selectedIndex))};
  [...sel.options].forEach((op,i)=>{const li=document.createElement("li");const ob=document.createElement("button");ob.type="button";ob.setAttribute("role","option");ob.textContent=op.text;
   ob.onclick=()=>{sel.selectedIndex=i;sel.dispatchEvent(new Event("change",{bubbles:true}));sync();close();b.focus()};li.append(ob);ul.append(li)});
  const close=()=>{wrap.classList.remove("open");b.setAttribute("aria-expanded","false")};
  b.onclick=e=>{e.stopPropagation();const open=!wrap.classList.contains("open");document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open"));if(open){wrap.classList.add("open");b.setAttribute("aria-expanded","true");ul.querySelector('[aria-selected="true"]')?.focus()}};
  wrap.addEventListener("keydown",e=>{if(e.key==="Escape"){close();b.focus()}if(["ArrowDown","ArrowUp"].includes(e.key)&&wrap.classList.contains("open")){e.preventDefault();const bs=[...ul.querySelectorAll("button")],i=bs.indexOf(document.activeElement);bs[(i+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length].focus()}});
  wrap.prepend(b);wrap.append(ul);sel.addEventListener("change",sync);sync();
 });
}
document.addEventListener("click",e=>{if(!e.target.closest(".lang"))document.querySelector(".lang[open]")?.removeAttribute("open");if(!e.target.closest(".dd"))document.querySelectorAll(".dd.open").forEach(d=>{d.classList.remove("open");d.querySelector(".ddb").setAttribute("aria-expanded","false")})});
function bindTracks(){document.querySelectorAll("[data-track]").forEach(t=>t.addEventListener("scroll",()=>{const i=Math.round(t.scrollLeft/t.clientWidth);t.parentNode.querySelectorAll(".dots i").forEach((d,k)=>d.classList.toggle("on",k===i))},{passive:true}))}
let tt;function toast(h){const el=document.getElementById("toast");el.innerHTML=h;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,4500)}
const slide=(wrap,i)=>{const t=wrap.querySelector("[data-track]");if(!t)return;const n=t.children.length;i=(i+n)%n;t.scrollTo({left:i*t.clientWidth,behavior:"smooth"})};
const cur_i=t=>Math.round(t.scrollLeft/t.clientWidth);
function lightbox(o,start){
 if(!o)return;const ARR=(d,l)=>`<button class="arr ${d<0?"prev":"next"}" data-lb="${d}" aria-label="${l}"><svg viewBox="0 0 24 24"><path d="${d<0?"M15 5l-7 7 7 7":"M9 5l7 7-7 7"}"/></svg></button>`;
 const el=document.createElement("div");el.className="lb";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",L.lbAria);
 el.innerHTML=`<div class="lb-top"><span id="lbn">${start+1} / ${o.imgs.length}</span><button class="lb-x" data-lb="x" aria-label="${L.close}">×</button></div><div class="lb-track">${o.imgs.map((k,i)=>`<figure><img src="${IMG[k]}" alt="${f(L.photoAlt,{name:o.name,i:i+1})}" class="${k[0]==="p"?"plan":""}"></figure>`).join("")}</div>${o.imgs.length>1?ARR(-1,L.prevPhoto)+ARR(1,L.nextPhoto):""}`;
 document.body.append(el);window.__lenis?.stop();document.documentElement.style.overflow="hidden";
 const tr=el.querySelector(".lb-track");requestAnimationFrame(()=>{tr.scrollLeft=start*tr.clientWidth;el.classList.add("on")});
 tr.addEventListener("scroll",()=>{el.querySelector("#lbn").textContent=`${cur_i(tr)+1} / ${o.imgs.length}`},{passive:true});
 const go=d=>{const n=o.imgs.length;tr.scrollTo({left:((cur_i(tr)+d+n)%n)*tr.clientWidth,behavior:"smooth"})};
 const close=()=>{el.remove();window.__lenis?.start();document.documentElement.style.overflow="";document.removeEventListener("keydown",key)};
 const key=e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)};
 document.addEventListener("keydown",key);
 el.addEventListener("click",e=>{const b=e.target.closest("[data-lb]");if(b){b.dataset.lb==="x"?close():go(+b.dataset.lb)}else if(e.target.tagName!=="IMG")close()});
 el.querySelector(".lb-x").focus();
}
document.addEventListener("click",e=>{
 const ar=e.target.closest("[data-arr]");if(ar){e.preventDefault();const w=ar.closest(".ph-wrap");slide(w,cur_i(w.querySelector("[data-track]"))+(+ar.dataset.arr));return}
 const dt=e.target.closest("[data-dot]");if(dt){slide(dt.closest(".ph-wrap"),+dt.dataset.dot);return}
 const w=e.target.closest("[data-wa]");if(w){const v=w.dataset.wa;const o=O.find(x=>x.n==v);const gd=v.startsWith("g:")&&G.find(g=>g.slug===v.slice(2));const txt=v==="pick"?pickMsg():v.startsWith("d:")?f(L.msgDist,{d:v.slice(2)}):gd?(gd.msg||f(L.msgGuide,{cta:gd.cta})):msg(o);if(SITE.whatsapp){location.href=`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(txt)}`}else toast(f(L.noWa,{txt}));return}
 const tgb=e.target.closest("[data-tg]");if(tgb){const v=tgb.dataset.tg;const txt=v==="pick"?pickMsg():v?msg(O.find(x=>x.n==v)):"";if(txt){try{navigator.clipboard.writeText(txt).catch(()=>{})}catch(_){}toast(f(L.tgCopied,{txt}))}if(SITE.telegram)setTimeout(()=>window.open(`https://t.me/${SITE.telegram}`,"_blank"),txt?900:0);else if(!txt)toast(L.noTg);return}
 const pk=e.target.closest("[data-pk]");if(pk){st.pick[pk.dataset.pk]=pk.dataset.v;document.querySelectorAll(`[data-pk="${pk.dataset.pk}"]`).forEach(b=>b.setAttribute("aria-pressed",b===pk));document.getElementById("pv").innerHTML=`<b>${L.pvLead}</b> ${pickMsg()}`;return}
 const g=e.target.closest("[data-go]");if(g){e.preventDefault();const go=()=>{const t=document.getElementById(g.dataset.go);if(!t)return;window.__lenis?window.__lenis.scrollTo(t,{offset:-80}):t.scrollIntoView({behavior:"smooth"})};if((cur()||curG())&&g.dataset.go!=="contact"){location.href=P+"/#"+g.dataset.go}else go();return}
 const a=e.target.closest("[data-act]");if(!a)return;
 if(a.dataset.act==="video"){if(cur().youtube)location.href="https://www.youtube.com/watch?v="+cur().youtube;else toast(L.videoSoon);}
 if(a.dataset.act==="photo")lightbox(cur(),+a.dataset.i||0);
 if(a.dataset.act==="copy"){const t=location.origin+P+"/o/"+cur().n+"/";try{navigator.clipboard.writeText(t).then(()=>a.textContent=L.copied,()=>getSelection().selectAllChildren(document.getElementById("slink")))}catch(_){getSelection().selectAllChildren(document.getElementById("slink"))}}
});
document.addEventListener("change",e=>{const fk=e.target.dataset.f;if(!fk)return;st[fk]=e.target.value;const l=filtered();const gr=document.getElementById("grid");gr.innerHTML=gridHTML(l);document.getElementById("found").textContent=f(L.found,{n:l.length});bindTracks();window.motion?.cards(gr)});
// Lead source: UTM tags from an Instagram link or the referring site, kept for this visit.
let SRC="";try{const q=new URLSearchParams(location.search);SRC=[q.get("utm_source"),q.get("utm_campaign"),q.get("utm_content")].filter(Boolean).join(" / ")||sessionStorage.getItem("src")||(document.referrer&&!document.referrer.includes(location.host)?new URL(document.referrer).host:"");sessionStorage.setItem("src",SRC)}catch(_){}
document.addEventListener("submit",async e=>{if(e.target.id!=="lead")return;e.preventDefault();const fm=e.target,o=cur(),ok=document.getElementById("ok"),b=fm.querySelector("button[type=submit]");
 const wi=+document.getElementById("l-when").value||0;const lead={name:document.getElementById("l-name").value,contact:document.getElementById("l-ph").value,when:WHEN_RU[wi],lang:LANG,n:o?o.n:null,src:SRC,page:location.pathname,website:fm.elements.website?.value||""};
 b.disabled=true;try{const r=await fetch("/api/lead/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lead)});if(!r.ok)throw 0;ok.textContent=f(L.lOk,{name:lead.name,when:L.whenIn[wi]});ok.hidden=false;fm.querySelectorAll("input,select").forEach(x=>x.disabled=true);b.hidden=true}
 catch(_){b.disabled=false;const t=f(L.lFallback,{name:lead.name,contact:lead.contact,when:L.whenIn[wi]})+(o?f(L.lFallbackObj,{n:o.n}):"");if(SITE.whatsapp)location.href=`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(t)}`;else{ok.textContent=L.lFail;ok.hidden=false}}});
if(location.hash){const t=document.getElementById(location.hash.slice(1));t&&setTimeout(()=>t.scrollIntoView(),0)}
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
